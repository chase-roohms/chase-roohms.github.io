<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 235" width="340" height="235" role="img" aria-labelledby="title">
  <title id="title">User adoption funnel, from licensed users to meaningful impact</title>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <rect x="10" y="8" width="320" height="38" rx="5" fill="#94A3B8"/>
    <text x="170" y="31" fill="#FFFFFF">Licensed users</text>
    <rect x="36.5" y="53" width="267" height="38" rx="5" fill="#64748B"/>
    <text x="170" y="76" fill="#FFFFFF">Activated users</text>
    <rect x="63.5" y="98" width="213" height="38" rx="5" fill="#367F9F"/>
    <text x="170" y="121" fill="#FFFFFF">Engaged users</text>
    <rect x="90" y="143" width="160" height="38" rx="5" fill="#247C90"/>
    <text x="170" y="166" fill="#FFFFFF">Retained users</text>
    <rect x="116.5" y="188" width="107" height="38" rx="5" fill="#16776C"/>
    <text x="170" y="211" fill="#FFFFFF">Meaningful impact</text>
  </g>
</svg>
