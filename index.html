<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chase Roohms" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="preload" as="image" href="/headshot-hero-1000.webp" imagesrcset="/headshot-hero-600.webp 696w, /headshot-hero-1000.webp 1160w" imagesizes="(min-width: 768px) 34.8rem, 95vw" fetchpriority="high" />
    <!-- Title, description, canonical, and other meta tags are dynamically managed by React Helmet in each page component -->
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CWVDN28C7W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CWVDN28C7W');
    </script>
    
    <!-- Theme: saved choice, else the browser setting. Runs before paint to avoid a flash. -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0f0f0f' : '#f6f5f3');
      })();
    </script>
    <style>
      html, body {
        background-color: #f6f5f3;
        margin: 0;
        padding: 0;
      }
      html.dark, html.dark body {
        background-color: #0f0f0f;
      }
    </style>
    <!-- Single Page Apps GitHub Pages redirect script -->
    <script type="text/javascript">
      // Decode the redirect from 404.html if present
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
